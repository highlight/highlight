version: "2"
linters:
  enable:
    - depguard
    - exhaustruct
  settings:
    depguard:
      rules:
        main:
          list-mode: lax
          deny:
            - pkg: log
              desc: logging is allowed only by github.com/sirupsen/logrus
    exhaustruct:
      include:
        - backend/alerts
    staticcheck:
      checks:
        - all
        # v1 ran only staticcheck (SA) and gosimple (S); v2 folds in stylecheck and quickfix.
        - -ST*
        - -QF*
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - private-graph/graph/generated
      - public-graph/graph/generated
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
