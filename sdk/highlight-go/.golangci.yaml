version: "2"
linters:
  settings:
    staticcheck:
      checks:
        - all
        # v1 ran only staticcheck (SA) and gosimple (S); v2 folds in stylecheck and quickfix.
        - -ST*
        - -QF*
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
